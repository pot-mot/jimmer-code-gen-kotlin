version: '3.8'

services:
  # MySQL versions (ports 39100-39109)
  mysql-5.7:
    image: mysql:5.7
    container_name: test-mysql-5.7
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - "39100:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ../resources/sql/metadata-test-mysql5.7.sql:/docker-entrypoint-initdb.d/init.sql

  mysql-8.4.7:
    image: mysql:8.4.7
    container_name: test-mysql-8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - "39101:3306"
    volumes:
      - ../resources/sql/metadata-test-mysql8.4.7.sql:/docker-entrypoint-initdb.d/init.sql

  # PostgreSQL versions (ports 39110-39119)
  postgresql-16:
    image: postgres:16
    container_name: test-postgresql-16
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "39110:5432"
    volumes:
      - ../resources/sql/metadata-test-postgresql.sql:/docker-entrypoint-initdb.d/init.sql

  postgresql-17:
    image: postgres:17
    container_name: test-postgresql-17
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "39111:5432"
    volumes:
      - ../resources/sql/metadata-test-postgresql.sql:/docker-entrypoint-initdb.d/init.sql

  # Oracle (ports 39120-39129)
  oracle-xe-21:
    image: gvenzl/oracle-xe:21.3.0-slim
    container_name: test-oracle-xe-21
    environment:
      ORACLE_PASSWORD: test
    ports:
      - "39120:1521"
    volumes:
      - ../resources/sql/metadata-test-oracle.sql:/docker-entrypoint-initdb.d/init.sql

  oracle-xe-18:
    image: gvenzl/oracle-xe:18.4.0-slim
    container_name: test-oracle-xe-18
    environment:
      ORACLE_PASSWORD: test
    ports:
      - "39121:1521"
    volumes:
      - ../resources/sql/metadata-test-oracle.sql:/docker-entrypoint-initdb.d/init.sql

  # SQL Server (ports 39130-39139)
  sqlserver-2019:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: test-sqlserver-2019
    environment:
      SA_PASSWORD: "Test1234!"
      ACCEPT_EULA: "Y"
    ports:
      - "39130:1433"
    volumes:
      - ../resources/sql/metadata-test-sqlserver.sql:/docker-entrypoint-initdb.d/init.sql
      - ../resources/sql/init-sqlserver.sh:/docker-entrypoint-initdb.d/init-sqlserver.sh
    entrypoint: /docker-entrypoint-initdb.d/init-sqlserver.sh

  sqlserver-2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: test-sqlserver-2022
    environment:
      SA_PASSWORD: "Test1234!"
      ACCEPT_EULA: "Y"
    ports:
      - "39131:1433"
    volumes:
      - ../resources/sql/metadata-test-sqlserver.sql:/docker-entrypoint-initdb.d/init.sql
      - ../resources/sql/init-sqlserver.sh:/docker-entrypoint-initdb.d/init-sqlserver.sh
    entrypoint: /docker-entrypoint-initdb.d/init-sqlserver.sh
